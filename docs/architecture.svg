<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img">
  <title>Four hosts share one maki-peer spool</title>
  <desc>Maki, OpenCode, Grok, and Vibe write presence and mail into one local spool. Each host reads its own inbox and delivers that text into its own session.</desc>
  <rect width="880" height="460" fill="#fbfbfa"/>
  <defs>
    <marker id="write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#3e5163"/>
    </marker>
    <marker id="deliver" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1d5c4a"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect x="24" y="20" width="196" height="108" rx="8" fill="#fff" stroke="#1f4b6e" stroke-width="1.5"/>
      <rect x="24" y="20" width="196" height="26" rx="8" fill="#1f4b6e"/>
      <rect x="24" y="36" width="196" height="10" fill="#1f4b6e"/>
      <text x="122" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Maki</text>
      <text x="122" y="70" text-anchor="middle" fill="#1c2430" font-size="13">peer-*</text>
      <text x="122" y="92" text-anchor="middle" fill="#5c6b7a" font-size="12">polls the inbox</text>
      <text x="122" y="110" text-anchor="middle" fill="#5c6b7a" font-size="12">next turn reads it</text>
    </g>
    <g>
      <rect x="236" y="20" width="196" height="108" rx="8" fill="#fff" stroke="#1d5c4a" stroke-width="1.5"/>
      <rect x="236" y="20" width="196" height="26" rx="8" fill="#1d5c4a"/>
      <rect x="236" y="36" width="196" height="10" fill="#1d5c4a"/>
      <text x="334" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">OpenCode</text>
      <text x="334" y="70" text-anchor="middle" fill="#1c2430" font-size="13">oc-*</text>
      <text x="334" y="92" text-anchor="middle" fill="#5c6b7a" font-size="12">peer observation</text>
      <text x="334" y="110" text-anchor="middle" fill="#5c6b7a" font-size="12">resumes the session</text>
    </g>
    <g>
      <rect x="448" y="20" width="196" height="108" rx="8" fill="#fff" stroke="#6a3d1f" stroke-width="1.5"/>
      <rect x="448" y="20" width="196" height="26" rx="8" fill="#6a3d1f"/>
      <rect x="448" y="36" width="196" height="10" fill="#6a3d1f"/>
      <text x="546" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Grok</text>
      <text x="546" y="70" text-anchor="middle" fill="#1c2430" font-size="13">gk-*</text>
      <text x="546" y="92" text-anchor="middle" fill="#5c6b7a" font-size="12">hook at a turn boundary</text>
      <text x="546" y="110" text-anchor="middle" fill="#5c6b7a" font-size="12">idle mail waits</text>
    </g>
    <g>
      <rect x="660" y="20" width="196" height="108" rx="8" fill="#fff" stroke="#4a3d78" stroke-width="1.5"/>
      <rect x="660" y="20" width="196" height="26" rx="8" fill="#4a3d78"/>
      <rect x="660" y="36" width="196" height="10" fill="#4a3d78"/>
      <text x="758" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Vibe</text>
      <text x="758" y="70" text-anchor="middle" fill="#1c2430" font-size="13">vb-*</text>
      <text x="758" y="92" text-anchor="middle" fill="#5c6b7a" font-size="12">next tool result</text>
      <text x="758" y="110" text-anchor="middle" fill="#5c6b7a" font-size="12">idle mail can expire</text>
    </g>

    <g fill="none" stroke="#3e5163" stroke-width="1.5" marker-end="url(#write)">
      <path d="M117 128 V214"/>
      <path d="M329 128 V214"/>
      <path d="M541 128 V214"/>
      <path d="M753 128 V214"/>
    </g>
    <g fill="none" stroke="#1d5c4a" stroke-width="1.5" marker-end="url(#deliver)">
      <path d="M127 214 V128"/>
      <path d="M339 214 V128"/>
      <path d="M551 214 V128"/>
      <path d="M763 214 V128"/>
    </g>
    <text x="440" y="162" text-anchor="middle" fill="#3e5163" font-size="12">write</text>
    <text x="440" y="184" text-anchor="middle" fill="#1d5c4a" font-size="12">deliver</text>

    <rect x="90" y="214" width="700" height="148" rx="8" fill="#f4f7fa" stroke="#1c2430" stroke-width="1.5"/>
    <text x="440" y="242" text-anchor="middle" fill="#1c2430" font-size="15" font-weight="600">spool</text>
    <text x="440" y="264" text-anchor="middle" fill="#5c6b7a" font-size="12">~/.maki/peers, or the XDG state directory</text>
    <line x1="440" y1="280" x2="440" y2="342" stroke="#c5d0da"/>
    <text x="264" y="304" text-anchor="middle" fill="#1c2430" font-size="13" font-weight="600">owners/</text>
    <text x="264" y="326" text-anchor="middle" fill="#5c6b7a" font-size="12">&lt;peer-id&gt;.json</text>
    <text x="264" y="346" text-anchor="middle" fill="#5c6b7a" font-size="12">cwd, status, origin.host</text>
    <text x="616" y="304" text-anchor="middle" fill="#1c2430" font-size="13" font-weight="600">inboxes/</text>
    <text x="616" y="326" text-anchor="middle" fill="#5c6b7a" font-size="12">&lt;peer-id&gt;/&lt;message-id&gt;.json</text>
    <text x="616" y="346" text-anchor="middle" fill="#5c6b7a" font-size="12">from, to, body, topic</text>

    <text x="440" y="400" text-anchor="middle" fill="#5c6b7a" font-size="13">Same machine, same user. A broadcast can be limited to one directory.</text>
  </g>
</svg>
