name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  BUN_VERSION: "1.4.2"
  STYLUA_VERSION: v2.4.1

jobs:
  fmt:
    name: Format (Rust)
    if: github.repository != 'lu-zero/maki-lua-plugin-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  fmt-lua:
    name: Format (Lua)
    if: github.repository != 'lu-zero/maki-lua-plugin-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stylua
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o stylua.zip stylua
          rm stylua.zip
      - run: ./stylua --check plugin/

  skills:
    name: Skills
    if: github.repository != 'lu-zero/maki-lua-plugin-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun skills/assemble.ts --check

  lint:
    name: Lint
    if: github.repository != 'lu-zero/maki-lua-plugin-template'
    runs-on: ubuntu-latest
    env:
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --tests -- -D warnings

  test:
    name: Test
    if: github.repository != 'lu-zero/maki-lua-plugin-template'
    runs-on: ubuntu-latest
    env:
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run

  hosts:
    name: ${{ matrix.host }} plugin
    if: github.repository != 'lu-zero/maki-lua-plugin-template'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [opencode, grok, vibe, claude]
    defaults:
      run:
        working-directory: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles(format('{0}/bun.lock', matrix.host)) }}
          restore-keys: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
